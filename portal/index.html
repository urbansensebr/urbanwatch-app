<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portais Profissionais | UrbanWatch</title>

<meta name="description" content="Portal Profissional UrbanWatch. Escolha entre Portal Essencial ou Portal Premium.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
font-family:Georgia, serif;
color:#f5f5f5;
}

.hero{
position:relative;
max-width:1400px;
margin:auto;
}

.hero img{
width:100%;
display:block;
}

.botao{
position:absolute;
display:block;
text-indent:-9999px;
overflow:hidden;
}

/* BOTÃO PORTAL ESSENCIAL */
.essencial{
left:7%;
bottom:23%;
width:41%;
height:8%;
}

/* BOTÃO PORTAL PREMIUM */
.premium{
right:7%;
bottom:23%;
width:41%;
height:8%;
}

.links{
padding:40px 20px;
text-align:center;
}

.links a{
display:inline-block;
padding:14px 26px;
margin:8px;
border:1px solid #D4AF37;
border-radius:40px;
text-decoration:none;
color:#D4AF37;
font-size:18px;
transition:.3s;
}

.links a:hover{
background:#D4AF37;
color:#050505;
}

footer{
padding:30px;
text-align:center;
color:#b89c4d;
line-height:1.8;
font-size:15px;
}

</style>
</head>

<body>

<div class="hero">

<img src="/assets/portal-profissional-urbanwatch.png"
alt="Portal Profissional UrbanWatch">

<a class="botao essencial"
href="/portal/essencial/">

Portal Essencial

</a>

<a class="botao premium"
href="/portal/premium/">

Portal Premium

</a>

</div>

<section class="links">

<a href="/">🏠 Home UrbanWatch</a>

</section>

<footer>

<p><strong>UrbanWatch®</strong></p>

<p>
Inteligência para quem não improvisa.
</p>

<p>
Fortaleza • Ceará • Brasil
</p>

</footer>
