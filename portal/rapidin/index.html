<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rapidin | UrbanWatch</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.banner{
    width:100%;
}

.banner img{
    width:100%;
    display:block;
    border-radius:18px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
    margin-top:25px;
    margin-bottom:35px;
}

.btn{
    text-decoration:none;
    color:#ffffff;
    border:1px solid #2cff47;
    border-radius:12px;
    padding:16px 28px;
    font-weight:bold;
    min-width:180px;
    text-align:center;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.whatsapp{
    background:#19c81b;
    border:none;
}

.instagram{
    background:transparent;
}

.localizacao{
    background:transparent;
}

.footer{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:25px;
}

@media(max-width:768px){

    .container{
        padding:8px;
    }

    .btn{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- ARTE PRINCIPAL RAPIDIN -->

    <section class="banner">

        <img
        src="../../assets/rapidin/rapidin-banner.png"
        alt="Rapidin Mobilidade Elétrica">

    </section>

    <!-- BOTÕES -->

    <div class="buttons">

        <a
        class="btn whatsapp"
        href="https://wa.me/55SEUNUMERO"
        target="_blank">
        WhatsApp
        </a>

        <a
        class="btn instagram"
        href="https://instagram.com/rapidin_eletroposto"
        target="_blank">
        Instagram
        </a>

        <a
        class="btn localizacao"
        href="https://maps.google.com/"
        target="_blank">
        Localização
        </a>

    </div>

    <div class="footer">

        Portal Profissional UrbanWatch<br>
        Conexões genuínas geram oportunidades reais.

    </div>

</div>

</body>
</html>
