<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapidin | Portal UrbanWatch</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#050805;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

.banner img{
  width:100%;
  display:block;
  border-radius:18px;
  box-shadow:0 0 30px rgba(0,0,0,.45);
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:14px;
  margin:26px 0 34px;
}

.btn{
  padding:15px 24px;
  border-radius:14px;
  text-decoration:none;
  font-weight:700;
  color:#fff;
  border:1px solid #41ff4a;
}

.btn-whatsapp{
  background:#18b718;
  border:none;
}

.footer{
  text-align:center;
  color:#aaa;
  font-size:14px;
  padding:18px 0 8px;
}

.footer strong{color:#41ff4a}

@media(max-width:768px){
  .container{padding:10px}
  .banner img{border-radius:10px}
  .btn{width:100%;text-align:center}
}
</style>
</head>

<body>

<div class="container">

  <section class="banner">
    <img src="../../assets/rapidin/rapidin-banner.png" alt="Rapidin Mobilidade Elétrica">
  </section>

  <div class="buttons">
    <a class="btn btn-whatsapp" href="https://wa.me/5585986890282" target="_blank">WhatsApp</a>
    <a class="btn" href="https://instagram.com/rapidin_eletroposto" target="_blank">Instagram</a>
    <a class="btn" href="https://maps.google.com/?q=Avenida+Barão+de+Studart+1480+Fortaleza" target="_blank">Localização</a>
  </div>

  <div class="footer">
    Portal Profissional <strong>UrbanWatch</strong><br>
    Conexões Genuínas geram oportunidades reais.
  </div>

</div>

</body>
</html>
