<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Mairton | Portal UrbanWatch</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#020817;
  font-family:Arial, Helvetica, sans-serif;
  color:#fff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:10px;
}

.banner img{
  width:100%;
  display:block;
  border-radius:18px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:14px;
  margin:24px 0 32px;
}

.btn{
  text-decoration:none;
  color:#fff;
  border:1px solid #D4AF37;
  border-radius:14px;
  padding:15px 24px;
  font-weight:bold;
  min-width:180px;
  text-align:center;
}

.whatsapp{
  background:#18b718;
  border:none;
}

.footer{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin-bottom:24px;
}

.footer strong{
  color:#D4AF37;
}

@media(max-width:768px){
  .container{padding:8px}
  .btn{width:100%}
}
</style>
</head>

<body>

<div class="container">

  <section class="banner">
    <img src="../../assets/Mairton/mairton-banner.png" alt="Portal Dr. Mairton">
  </section>

  <div class="buttons">
    <a class="btn whatsapp" href="https://wa.me/5585986890282" target="_blank">WhatsApp</a>
    <a class="btn" href="#" target="_blank">Instagram</a>
    <a class="btn" href="#" target="_blank">Localização</a>
    <a class="btn" href="#" target="_blank">Agendar</a>
  </div>

  <div class="footer">
    Portal Profissional <strong>UrbanWatch</strong><br>
    Conexões genuínas geram oportunidades reais.
  </div>

</div>

</body>
</html>
