<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanWatch | Apresentação Institucional</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
      background:#0A0A0A;
    }

    body{
      background:#0A0A0A;
      color:#FFFFFF;
      font-family:Arial, Helvetica, sans-serif;
      overflow-x:hidden;
    }

    .slide{
      width:100vw;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0A0A0A;
      scroll-snap-align:start;
    }

    main{
      width:100%;
      scroll-snap-type:y mandatory;
    }

    .slide img{
      width:100vw;
      height:100vh;
      object-fit:contain;
      display:block;
      background:#0A0A0A;
    }

    @media (max-width:768px){
      .slide{
        height:100vh;
      }

      .slide img{
        width:100vw;
        height:100vh;
        object-fit:contain;
      }
    }
  </style>
</head>

<body>

<main>

  <section class="slide">
    <img src="../assets/apresentacao/slide00.png" alt="Slide 00">
  </section>

  <section class="slide">
    <img src="../assets/apresentacao/slide01.png" alt="Slide 01">
  </section>

  <section class="slide">
    <img src="../assets/apresentacao/slide02.png" alt="Slide 02">
  </section>

  <section class="slide">
    <img src="../assets/apresentacao/slide03.png" alt="Slide 03">
  </section>

  <section class="slide">
    <img src="../assets/apresentacao/slide04.png" alt="Slide 04">
  </section>

  <section class="slide">
    <img src="../assets/apresentacao/slide05.png" alt="Slide 05">
  </section>

  <section class="slide">
    <img src="../assets/apresentacao/slide06.png" alt="Slide 06">
  </section>

  <section class="slide">
    <img src="../assets/apresentacao/slide07.png" alt="Slide 07">
  </section>

  <section class="slide">
    <img src="../assets/apresentacao/slide08.png" alt="Slide 08">
  </section>

  <section class="slide">
    <img src="../assets/apresentacao/slide09.png" alt="Slide 09">
  </section>

</main>

</body>
</html>
