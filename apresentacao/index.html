<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UrbanWatch | Apresentação Institucional</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    overflow-y:auto;
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
}

.slide{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;
}

.slide img{
    width:100vw;
    height:100vh;

    object-fit:contain;
    display:block;
}

@media (max-width:768px){

    .slide{
        min-height:auto;
    }

    .slide img{
        width:100%;
        height:auto;
        object-fit:contain;
    }

}

</style>
</head>

<body>

<section class="slide">
    <img src="../assets/apresentacao/slide00.png" alt="Slide 00">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide01.png" alt="Slide 01">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide02.png" alt="Slide 02">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide03.png" alt="Slide 03">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide04.png" alt="Slide 04">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide05.png" alt="Slide 05">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide06.png" alt="Slide 06">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide06b.png" alt="Ecossistema UrbanWatch">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide07.png" alt="Slide 07">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide08.png" alt="Slide 08">
</section>

<section class="slide">
    <img src="../assets/apresentacao/slide09.png" alt="Slide 09">
</section>

</body>
</html>
