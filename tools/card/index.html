<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>UrbanWatch Tools | Card Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Montserrat,sans-serif;
}

body{

background:#0A0A0A;
color:white;
padding:40px;

}

.container{

max-width:1100px;
margin:auto;

}

h1{

color:#D4AF37;
margin-bottom:5px;

}

.subtitle{

color:#F1E5AC;
margin-bottom:40px;

}

.form{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:40px;

}

input,select{

padding:15px;
background:#151515;
border:1px solid #333;
color:white;
border-radius:12px;
font-size:15px;

}

button{

padding:16px;
background:#D4AF37;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
font-weight:bold;

}

.preview{

display:flex;
justify-content:center;

}

.card{

width:340px;
height:540px;

background:#101010;

border-radius:25px;

border:2px solid #D4AF37;

padding:30px;

position:relative;

box-shadow:0px 0px 40px rgba(212,175,55,.25);

}

.logo{

font-size:20px;

letter-spacing:4px;

color:#D4AF37;

text-align:center;

margin-top:15px;

}

.tipo{

margin-top:50px;

text-align:center;

font-size:28px;

font-weight:700;

}

.nome{

margin-top:20px;

font-size:24px;

text-align:center;

color:white;

}

.profissao{

margin-top:10px;

text-align:center;

color:#F1E5AC;

}

.footer{

position:absolute;

bottom:30px;

left:0;

width:100%;

text-align:center;

font-size:13px;

color:#888;

}

.nfc{

margin-top:60px;

font-size:70px;

text-align:center;

color:#D4AF37;

}

</style>

</head>

<body>

<div class="container">

<h1>Card Generator</h1>

<div class="subtitle">

UrbanWatch Tools

</div>

<div class="form">

<input id="nome" placeholder="Nome">

<input id="profissao" placeholder="Profissão">

<input id="tipo" placeholder="Portal Profissional">

<select id="tema">

<option>Premium</option>

<option>Black</option>

<option>Gold</option>

</select>

<button onclick="gerar()">

Atualizar Prévia

</button>

</div>

<div class="preview">

<div class="card">

<div class="logo">

URBANWATCH

</div>

<div class="tipo" id="vTipo">

Portal Profissional

</div>

<div class="nome" id="vNome">

Seu Nome

</div>

<div class="profissao" id="vProfissao">

Sua Profissão

</div>

<div class="nfc">

◉

</div>

<div class="footer">

Inteligência para quem não improvisa.

</div>

</div>

</div>

</div>

<script>

function gerar(){

vNome.innerHTML=nome.value||"Seu Nome";

vProfissao.innerHTML=profissao.value||"Sua Profissão";

vTipo.innerHTML=tipo.value||"Portal Profissional";

}

</script>

</body>

</html>
