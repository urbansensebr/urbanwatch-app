<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Portal Home | Cangaceiro • UrbanWatch.app</title>

<style>
:root{
  --bg:#050505;
  --panel:#0b0b0b;
  --gold:#d4af37;
  --gold2:#f1e5ac;
  --text:#ffffff;
  --muted:#888888;
  --line:rgba(212,175,55,.72);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,rgba(212,175,55,.10),transparent 32%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.page{
  width:100%;
  max-width:820px;
  margin:0 auto;
  padding:0 12px 28px;
}

/* IMAGEM DA RECEPÇÃO NO TOPO */

.recepcao{
  width:100%;
  overflow:hidden;
  background:#000;
  border-bottom:1px solid var(--line);
}

.recepcao img{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
}

/* CABEÇALHO */

.header{
  text-align:center;
  padding:32px 18px 24px;
}

.header h1{
  font-size:clamp(38px,8vw,64px);
  line-height:1;
  letter-spacing:4px;
  font-weight:900;
}

.header p{
  margin-top:18px;
  color:var(--gold2);
  font-size:clamp(17px,3.8vw,23px);
  line-height:1.4;
}

/* BOTÕES */

.menu{
  display:grid;
  gap:22px;
  padding:10px 18px 34px;
}

.menu a{
  min-height:102px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  border:1px solid var(--line);
  border-radius:28px;
  background:rgba(11,11,11,.86);
  color:var(--gold);
  font-size:clamp(20px,4.8vw,27px);
  font-weight:800;
  transition:
    transform .18s ease,
    background .18s ease,
    box-shadow .18s ease;
}

.menu a:hover,
.menu a:focus-visible{
  transform:translateY(-2px);
  background:rgba(212,175,55,.10);
  box-shadow:
    0 0 0 2px rgba(241,229,172,.20),
    0 0 26px rgba(212,175,55,.18);
  outline:none;
}

.menu a:active{
  transform:scale(.99);
}

/* IMAGEM FINAL */

.imagem-final{
  width:100%;
  padding:18px 18px 8px;
  display:flex;
  justify-content:center;
}

.imagem-final img{
  display:block;
  width:100%;
  max-width:720px;
  height:auto;
  object-fit:contain;
}

/* RODAPÉ */

.footer{
  margin-top:22px;
  padding:22px 14px 8px;
  border-top:1px solid var(--line);
  text-align:center;
  color:var(--muted);
  font-size:13px;
  letter-spacing:2px;
}

@media(max-width:680px){
  .page{
    padding:0 0 24px;
  }

  .header{
    padding-top:28px;
  }

  .menu{
    padding-left:28px;
    padding-right:28px;
  }

  .menu a{
    min-height:102px;
    border-radius:28px;
  }

  .imagem-final{
    padding-left:12px;
    padding-right:12px;
  }
}

@media(max-width:420px){
  .header h1{
    letter-spacing:3px;
  }

  .menu{
    gap:22px;
  }

  .menu a{
    min-height:100px;
  }

  .footer{
    font-size:12px;
    letter-spacing:1.5px;
  }
}
</style>
</head>

<body>

<main class="page">

  <!--
    IMAGEM 1 NA PASTA RAIZ:
    recepcao-cangaceiro.png
  -->
  <section class="recepcao" aria-label="Recepção Cangaceiro Sanduíches">
    <img
      src="recepcao-cangaceiro.png"
      alt="Cangaceiro Sanduíches — Recepção"
    />
  </section>

  <header class="header">
    <h1>CANGACEIRO</h1>
    <p>Portal Profissional Premium • UrbanWatch.app</p>
  </header>

  <nav class="menu" aria-label="Menu principal do Portal Cangaceiro">

    <a href="#redes-sociais">
      Redes Sociais
    </a>

    <a href="#conheca-o-cangaceiro">
      Conheça o Cangaceiro
    </a>

    <a href="#cardapio-completo">
      Cardápio Completo
    </a>

    <a href="/portal/uwo/acess/cangaceiro/">
      Portal UWO | Cangaceiro
    </a>

    <a
      href="https://wa.me/558532318993"
      target="_blank"
      rel="noopener noreferrer"
    >
      WhatsApp
    </a>

    <a href="#delivery">
      Delivery
    </a>

  </nav>

  <!--
    IMAGEM 2 NA PASTA RAIZ:
    bota-chapeu-lampiao.png
  -->
  <section class="imagem-final" aria-label="Símbolos do Cangaceiro">
    <img
      src="bota-chapeu-lampiao.png"
      alt="Bota, chapéu e lampião em estilo cangaceiro"
    />
  </section>

  <footer class="footer">
    UrbanWatch Platform • Portal Home Cangaceiro • v1.2
  </footer>

</main>

</body>
</html>
