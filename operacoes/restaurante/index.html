<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

<title>UrbanWatch.app Operações | Restaurante</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html, body{
  background:#050505;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
  overflow:auto;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(0,0,0,.9);
  border-bottom:1px solid rgba(212,175,55,.28);
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:18px;
  font-weight:700;
  letter-spacing:.4px;
}

.brand span{
  color:#d4af37;
}

.counter{
  color:#d4af37;
  font-size:14px;
  letter-spacing:2px;
}

main{
  width:100%;
  overflow:auto;
  padding:0 0 90px 0;
}

.slide{
  display:none;
  width:max-content;
  min-width:100%;
}

.slide.active{
  display:block;
}

.slide img{
  display:block;
  width:1600px;
  max-width:none;
  height:auto;
  margin:0 auto;
}

.controls{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  display:flex;
  gap:10px;
  background:rgba(0,0,0,.78);
  border:1px solid rgba(212,175,55,.38);
  border-radius:999px;
  padding:10px 14px;
  backdrop-filter:blur(8px);
}

button{
  background:#111;
  color:#fff;
  border:1px solid rgba(212,175,55,.55);
  border-radius:999px;
  padding:10px 15px;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#d4af37;
  color:#000;
}

@media(max-width:768px){
  header{
    padding:12px 14px;
  }

  .brand{
    font-size:15px;
  }

  .counter{
    font-size:12px;
  }

  .slide img{
    width:1200px;
    max-width:none;
    margin:0;
  }

  button{
    padding:9px 13px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">Urban<span>Watch</span>.app Operações</div>
  <div class="counter" id="counter">00 / 07</div>
</header>

<main id="viewer">
  <section class="slide active">
    <img src="00.png" alt="UWO Restaurante 00">
  </section>

  <section class="slide">
    <img src="01.png" alt="UWO Restaurante 01">
  </section>

  <section class="slide">
    <img src="02.png" alt="UWO Restaurante 02">
  </section>

  <section class="slide">
    <img src="03.png" alt="UWO Restaurante 03">
  </section>

  <section class="slide">
    <img src="04.png" alt="UWO Restaurante 04">
  </section>

  <section class="slide">
    <img src="05.png" alt="UWO Restaurante 05">
  </section>

  <section class="slide">
    <img src="06.png" alt="UWO Restaurante 06">
  </section>

  <section class="slide">
    <img src="07.png" alt="UWO Restaurante 07">
  </section>
</main>

<div class="controls">
  <button onclick="prevSlide()">←</button>
  <button onclick="goHome()">Início</button>
  <button onclick="nextSlide()">→</button>
</div>

<script>
const slides = document.querySelectorAll('.slide');
const counter = document.getElementById('counter');
let current = 0;

function showSlide(index){
  slides[current].classList.remove('active');

  current = (index + slides.length) % slides.length;

  slides[current].classList.add('active');
  counter.textContent = String(current).padStart(2,'0') + ' / 07';

  window.scrollTo({
    top:0,
    left:0,
    behavior:'instant'
  });
}

function nextSlide(){
  showSlide(current + 1);
}

function prevSlide(){
  showSlide(current - 1);
}

function goHome(){
  showSlide(0);
}

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') nextSlide();
  if(e.key === 'ArrowLeft') prevSlide();
  if(e.key === 'Home') goHome();
});
</script>

</body>
</html>
