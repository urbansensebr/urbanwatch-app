<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>UWO Restaurante</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  background:#050505;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  width:100%;
  height:100%;
  overflow:hidden;
}

.topo{
  height:54px;
  background:#000;
  border-bottom:1px solid #d4af37;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
}

.topo span{color:#d4af37}

.viewer{
  position:fixed;
  top:54px;
  left:0;
  right:0;
  bottom:70px;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  background:#050505;
}

.slide{
  display:none;
}

.slide.active{
  display:block;
}

.slide img{
  display:block;
  width:1800px;
  max-width:none;
  height:auto;
}

.controles{
  height:70px;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#000;
  border-top:1px solid #d4af37;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  z-index:10;
}

button{
  background:#111;
  color:#fff;
  border:1px solid #d4af37;
  border-radius:30px;
  padding:10px 18px;
  font-size:15px;
}

@media(max-width:768px){
  .slide img{
    width:1400px;
  }
}
</style>
</head>

<body>

<div class="topo">
  <strong>Urban<span>Watch</span>.app Operações</strong>
  <div id="contador">00 / 07</div>
</div>

<div class="viewer" id="viewer">
  <div class="slide active"><img src="00.png"></div>
  <div class="slide"><img src="01.png"></div>
  <div class="slide"><img src="02.png"></div>
  <div class="slide"><img src="03.png"></div>
  <div class="slide"><img src="04.png"></div>
  <div class="slide"><img src="05.png"></div>
  <div class="slide"><img src="06.png"></div>
  <div class="slide"><img src="07.png"></div>
</div>

<div class="controles">
  <button onclick="voltar()">←</button>
  <button onclick="inicio()">Início</button>
  <button onclick="avancar()">→</button>
</div>

<script>
const slides = document.querySelectorAll('.slide');
const contador = document.getElementById('contador');
const viewer = document.getElementById('viewer');

let atual = 0;

function mostrar(n){
  slides[atual].classList.remove('active');
  atual = (n + slides.length) % slides.length;
  slides[atual].classList.add('active');
  contador.textContent = String(atual).padStart(2,'0') + ' / 07';
  viewer.scrollTop = 0;
  viewer.scrollLeft = 0;
}

function avancar(){mostrar(atual + 1)}
function voltar(){mostrar(atual - 1)}
function inicio(){mostrar(0)}
</script>

</body>
</html>
