<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrbanWatch.app Operações | Restaurante</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#050505;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:10;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(212,175,55,.25);
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:18px;
  font-weight:700;
  letter-spacing:.5px;
}

.brand span{color:#d4af37}

.counter{
  color:#d4af37;
  font-size:14px;
  letter-spacing:2px;
}

main{
  padding-top:72px;
  min-height:100vh;
}

.slide{
  display:none;
  width:100%;
  min-height:calc(100vh - 72px);
  align-items:center;
  justify-content:center;
  padding:10px;
}

.slide.active{display:flex}

.slide img{
  width:100%;
  max-width:1600px;
  max-height:calc(100vh - 95px);
  object-fit:contain;
  border-radius:10px;
  box-shadow:0 0 35px rgba(212,175,55,.16);
}

.controls{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  gap:12px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(212,175,55,.35);
  border-radius:999px;
  padding:10px 14px;
  backdrop-filter:blur(8px);
}

button{
  background:#111;
  color:#fff;
  border:1px solid rgba(212,175,55,.55);
  border-radius:999px;
  padding:10px 16px;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#d4af37;
  color:#000;
}

.dots{
  position:fixed;
  bottom:76px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  gap:8px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
}

.dot.active{
  background:#d4af37;
}

@media(max-width:768px){
  header{padding:12px 14px}
  .brand{font-size:15px}
  .counter{font-size:12px}
  main{padding-top:62px}
  .slide{min-height:calc(100vh - 62px);padding:6px}
  .slide img{max-height:calc(100vh - 120px)}
  button{padding:9px 13px;font-size:14px}
}
</style>
</head>

<body>

<header>
  <div class="brand">Urban<span>Watch</span>.app Operações</div>
  <div class="counter" id="counter">00 / 07</div>
</header>

<main>
  <section class="slide active"><img src="00.png" alt="Apresentação UWO Restaurante 00"></section>
  <section class="slide"><img src="01.png" alt="Apresentação UWO Restaurante 01"></section>
  <section class="slide"><img src="02.png" alt="Apresentação UWO Restaurante 02"></section>
  <section class="slide"><img src="03.png" alt="Apresentação UWO Restaurante 03"></section>
  <section class="slide"><img src="04.png" alt="Apresentação UWO Restaurante 04"></section>
  <section class="slide"><img src="05.png" alt="Apresentação UWO Restaurante 05"></section>
  <section class="slide"><img src="06.png" alt="Apresentação UWO Restaurante 06"></section>
  <section class="slide"><img src="07.png" alt="Apresentação UWO Restaurante 07"></section>
</main>

<div class="dots" id="dots"></div>

<div class="controls">
  <button onclick="prevSlide()">←</button>
  <button onclick="goHome()">Início</button>
  <button onclick="nextSlide()">→</button>
</div>

<script>
const slides = document.querySelectorAll('.slide');
const counter = document.getElementById('counter');
const dotsBox = document.getElementById('dots');
let current = 0;

slides.forEach((_, i)=>{
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.onclick = () => showSlide(i);
  dotsBox.appendChild(dot);
});

const dots = document.querySelectorAll('.dot');

function showSlide(index){
  slides[current].classList.remove('active');
  dots[current].classList.remove('active');

  current = (index + slides.length) % slides.length;

  slides[current].classList.add('active');
  dots[current].classList.add('active');

  counter.textContent = String(current).padStart(2,'0') + ' / 07';
}

function nextSlide(){ showSlide(current + 1); }
function prevSlide(){ showSlide(current - 1); }
function goHome(){ showSlide(0); }

document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight') nextSlide();
  if(e.key === 'ArrowLeft') prevSlide();
  if(e.key === 'Home') goHome();
});

let touchStartX = 0;

document.addEventListener('touchstart', e=>{
  touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener('touchend', e=>{
  const touchEndX = e.changedTouches[0].screenX;
  if(touchStartX - touchEndX > 50) nextSlide();
  if(touchEndX - touchStartX > 50) prevSlide();
});
</script>

</body>
</html>
