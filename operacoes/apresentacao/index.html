<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanWatch Operações™ | Apresentação Institucional</title>

  <style>
    :root {
      --bg: #050505;
      --panel: #111;
      --gold: #d4af37;
      --gold2: #b8860b;
      --white: #ffffff;
      --muted: #aaaaaa;
      --border: rgba(212, 175, 55, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #1a1a1a 0%, #050505 60%);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gold);
    }

    .brand span {
      color: var(--white);
    }

    .counter {
      color: var(--muted);
      font-size: 14px;
    }

    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .slide-img {
      max-width: 100%;
      max-height: calc(100vh - 140px);
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.16);
      background: #000;
      object-fit: contain;
    }

    .controls {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.8);
      z-index: 10;
    }

    button, select {
      background: #111;
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover, select:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .primary {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #000;
      font-weight: bold;
    }

    .primary:hover {
      color: #000;
      filter: brightness(1.08);
    }

    .thumbs {
      position: fixed;
      right: 16px;
      top: 78px;
      bottom: 90px;
      width: 105px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .thumb {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      opacity: 0.55;
    }

    .thumb.active {
      opacity: 1;
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
    }

    .start {
      text-align: center;
      padding: 30px;
      max-width: 720px;
    }

    .start h1 {
      font-size: clamp(34px, 6vw, 72px);
      margin: 0;
      color: var(--gold);
      line-height: 1;
    }

    .start h2 {
      font-weight: normal;
      color: var(--white);
      margin: 18px 0;
    }

    .start p {
      color: var(--muted);
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    footer.note {
      position: fixed;
      left: 18px;
      bottom: 18px;
      font-size: 12px;
      color: var(--muted);
      z-index: 30;
    }

    @media (max-width: 900px) {
      .thumbs {
        display: none;
      }

      header {
        height: 58px;
      }

      .brand {
        font-size: 13px;
      }

      .slide-img {
        max-height: calc(100vh - 132px);
      }

      button, select {
        padding: 10px;
        font-size: 13px;
      }

      .controls {
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <div class="brand">URBAN<span>WATCH</span> OPERAÇÕES™</div>
      <div class="counter" id="counter">Capa</div>
    </header>

    <main id="main">
      <section class="start" id="startScreen">
        <h1>URBANWATCH OPERAÇÕES™</h1>
        <h2>Presença • Evidências • Supervisão</h2>
        <p>
          Apresentação Institucional da plataforma UrbanWatch Operações™.
          Controle operacional, evidências em campo e supervisão inteligente.
        </p>
        <button class="primary" onclick="startPresentation()">Iniciar Apresentação</button>
      </section>

      <img id="slideImage" class="slide-img hidden" src="" alt="Slide UrbanWatch Operações" />
    </main>

    <div class="thumbs" id="thumbs"></div>

    <div class="controls">
      <button onclick="prevSlide()">◀ Anterior</button>

      <select id="slideSelect" onchange="goToSlide(this.value)"></select>

      <button onclick="nextSlide()">Próximo ▶</button>
      <button onclick="toggleFullscreen()">⛶ Tela cheia</button>
    </div>

    <footer class="note">
      Powered by UrbanWatch.app
    </footer>
  </div>

  <script>
    const slides = [
      { title: "Capa", file: "/assets/operacoes/uwo-capa.png" },
      { title: "Slide 00 — Índice", file: "/assets/operacoes/uwo-indice.png" },
      { title: "Slide 01 — Visão Geral do Produto", file: "/assets/operacoes/uwo-slide01.png" },
      { title: "Slide 02 — Presença Inteligente", file: "/assets/operacoes/uwo-slide02.png" },
      { title: "Slide 03 — Evidências Operacionais", file: "/assets/operacoes/uwo-slide03.png" },
      { title: "Slide 04 — Supervisão em Tempo Real", file: "/assets/operacoes/uwo-slide04.png" },
      { title: "Slide 05 — NFC nos Pontos de Venda", file: "/assets/operacoes/uwo-slide05.png" },
      { title: "Slide 06 — Fluxo Completo da Operação", file: "/assets/operacoes/uwo-slide06.png" },
      { title: "Slide 07 — Caso Usibras", file: "/assets/operacoes/uwo-slide07.png" },
      { title: "Slide 08 — Antes x Depois", file: "/assets/operacoes/uwo-slide08.png" },
      { title: "Slide 09 — UrbanWatch Operações™", file: "/assets/operacoes/uwo-slide09.png" }
    ];

    let current = 0;
    let started = false;

    const startScreen = document.getElementById("startScreen");
    const slideImage = document.getElementById("slideImage");
    const counter = document.getElementById("counter");
    const slideSelect = document.getElementById("slideSelect");
    const thumbs = document.getElementById("thumbs");

    function buildNavigation() {
      slides.forEach((slide, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = slide.title;
        slideSelect.appendChild(option);

        const img = document.createElement("img");
        img.src = slide.file;
        img.alt = slide.title;
        img.className = "thumb";
        img.onclick = () => goToSlide(index);
        thumbs.appendChild(img);
      });
    }

    function startPresentation() {
      started = true;
      startScreen.classList.add("hidden");
      slideImage.classList.remove("hidden");
      showSlide(0);
    }

    function showSlide(index) {
      current = Number(index);

      if (current < 0) current = slides.length - 1;
      if (current >= slides.length) current = 0;

      const slide = slides[current];

      slideImage.src = slide.file;
      counter.textContent = `${current + 1} / ${slides.length} — ${slide.title}`;
      slideSelect.value = current;

      document.querySelectorAll(".thumb").forEach((thumb, i) => {
        thumb.classList.toggle("active", i === current);
      });
    }

    function goToSlide(index) {
      if (!started) {
        startPresentation();
      }
      showSlide(index);
    }

    function nextSlide() {
      if (!started) return startPresentation();
      showSlide(current + 1);
    }

    function prevSlide() {
      if (!started) return startPresentation();
      showSlide(current - 1);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "f" || e.key === "F") toggleFullscreen();
      if (e.key === "Escape" && document.fullscreenElement) document.exitFullscreen();
    });

    let touchStartX = 0;

    document.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    });

    document.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;

      if (Math.abs(diff) > 60) {
        if (diff > 0) nextSlide();
        else prevSlide();
      }
    });

    buildNavigation();
  </script>
</body>
  </html>
