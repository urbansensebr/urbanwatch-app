<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanWatch | Portal de Acesso</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0A0A0A;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid #D4AF37;
      border-radius: 24px;
      padding: 32px 24px;
      background: #111111;
    }

    .brand {
      color: #D4AF37;
      letter-spacing: 3px;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 10px;
    }

    .tagline {
      color: #F1E5AC;
      font-size: 15px;
      margin-bottom: 32px;
    }

    a {
      display: block;
      text-decoration: none;
      margin: 14px 0;
      padding: 16px;
      border-radius: 14px;
      background: #0A0A0A;
      border: 1px solid #D4AF37;
      color: #FFFFFF;
    }

    a strong {
      display: block;
      font-size: 18px;
      color: #D4AF37;
      margin-bottom: 5px;
    }

    a span {
      display: block;
      font-size: 13px;
      color: #CCCCCC;
    }

    .footer {
      margin-top: 28px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="box">
    <div class="brand">URBANWATCH</div>

    <h1>Portal de Acesso</h1>

    <div class="tagline">
      Uma aproximação. Três caminhos.
    </div>

    <a href="/portal/">
      <strong>Sou Cliente</strong>
      <span>Acessar serviços e informações.</span>
    </a>

    <a href="/login/">
      <strong>Sou Equipe</strong>
      <span>Acesso operacional.</span>
    </a>

    <a href="/">
      <strong>UrbanWatch.app</strong>
      <span>Conheça a plataforma.</span>
    </a>

    <div class="footer">
      Inteligência para quem não improvisa.
    </div>
  </main>

</body>
</html>
