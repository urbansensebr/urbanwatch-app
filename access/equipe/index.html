<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UrbanWatch | Acesso da Equipe</title>

<link rel="stylesheet" href="../assets/style.css">

</head>

<body>

<main class="uw-box">

    <img
        src="/assets/brand/logo/logo.png"
        alt="UrbanWatch"
        class="uw-logo">

    <h1 class="uw-title">
        Acesso da Equipe
    </h1>

    <p class="uw-subtitle">
        Área operacional da plataforma UrbanWatch.
    </p>

    <div class="uw-text">

        Faça sua autenticação para acessar os recursos disponíveis conforme seu perfil de acesso.

    </div>

    <form action="/access/equipe/painel/">

        <input
            class="uw-input"
            type="email"
            placeholder="E-mail"
            required>

        <input
            class="uw-input"
            type="password"
            placeholder="Senha"
            required>

        <button
            class="uw-action"
            type="submit">

            Entrar

        </button>

    </form>

    <a
        class="uw-link"
        href="/access/">

        ← Voltar ao Portal de Acesso

    </a>

    <div class="uw-footer">

        Inteligência para quem não improvisa.

        <div class="uw-version">

            UrbanWatch Platform • v1.1

        </div>

    </div>

</main>

</body>

</html>
