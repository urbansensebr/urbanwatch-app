<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UrbanWatch | Acesso da Equipe</title>

    <link rel="stylesheet" href="/access/assets/style.css">

</head>

<body>

<main class="uw-box">

    <img
        src="/assets/brand/logo/logo.png"
        alt="UrbanWatch"
        class="uw-logo">

    <h1 class="uw-title">
        Acesso da Equipe
    </h1>

    <p class="uw-subtitle">
        Área Operacional UrbanWatch
    </p>

    <div class="uw-text">

        Faça sua autenticação para acessar os recursos operacionais da plataforma.

    </div>

    <input
        class="uw-input"
        type="email"
        placeholder="E-mail">

    <input
        class="uw-input"
        type="password"
        placeholder="Senha">

    <a
        class="uw-button"
        href="/access/equipe/painel/">

        <strong>
            Entrar
        </strong>

        <span>
            Login em implantação.
        </span>

    </a>

    <a
        class="uw-link"
        href="/access/">

        ← Voltar ao Portal de Acesso

    </a>

    <div class="uw-footer">

        Inteligência para quem não improvisa.

        <div class="uw-version">

            UrbanWatch Platform • v1.1

        </div>

    </div>

</main>

</body>

</html>
