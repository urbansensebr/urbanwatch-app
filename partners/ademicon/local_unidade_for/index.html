<!DOCTYPE html>

  <title>UrbanWatch.app × Ademicon | Executive Briefing</title>
  <style>
    :root{--bg:#050505;--panel:#0c0c0d;--gold:#d4af37;--gold2:#f1d47a;--text:#f7f7f7;--muted:#b9b9bd;--line:rgba(212,175,55,.26);--shadow:0 25px 80px rgba(0,0,0,.55);--radius:24px;--header:76px;--footer:62px}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(212,175,55,.10),transparent 26%),radial-gradient(circle at 100% 100%,rgba(212,175,55,.08),transparent 28%),var(--bg);color:var(--text);font-family:Montserrat,Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden} button,a{font:inherit} button{border:0} img{-webkit-user-drag:none;user-select:none}
    .app{min-height:100vh;display:grid;grid-template-rows:var(--header) 1fr var(--footer)}
    .topbar{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 clamp(18px,3vw,44px);background:linear-gradient(180deg,rgba(5,5,5,.98),rgba(5,5,5,.88));border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}.brand-mark{width:42px;height:42px;border:1px solid rgba(212,175,55,.72);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-weight:800;letter-spacing:-2px;box-shadow:0 0 30px rgba(212,175,55,.12);flex:0 0 auto}.brand-copy{min-width:0}.brand-title{font-size:clamp(.92rem,1.5vw,1.08rem);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-title span{color:var(--gold)}.brand-subtitle{margin-top:3px;color:var(--muted);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:flex;align-items:center;gap:9px}.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:.22s ease}.icon-btn:hover{color:var(--gold2);border-color:rgba(212,175,55,.55);transform:translateY(-1px);background:rgba(212,175,55,.08)}.icon-btn svg{width:19px;height:19px}
    .stage{position:relative;min-height:0;display:grid;place-items:center;padding:clamp(10px,2vw,26px);isolation:isolate}.ambient{position:absolute;inset:0;pointer-events:none;opacity:.48;background:linear-gradient(115deg,transparent 0 44%,rgba(212,175,55,.04) 49%,transparent 54%),radial-gradient(circle at 50% 50%,rgba(212,175,55,.08),transparent 46%);z-index:-2}
    .presentation-shell{position:relative;width:min(94vw,1450px);height:min(calc(100vh - var(--header) - var(--footer) - 28px),82vw * .5625);max-height:calc(100vh - var(--header) - var(--footer) - 28px);aspect-ratio:16/9;border-radius:var(--radius);background:#090909;border:1px solid rgba(212,175,55,.22);box-shadow:var(--shadow);overflow:hidden;touch-action:none;overscroll-behavior:contain}.presentation-shell:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:6;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)}
    .slide{position:absolute;inset:0;opacity:0;transform:scale(1.018);transition:opacity .48s ease,transform .72s cubic-bezier(.22,.72,.18,1);pointer-events:none;display:grid;place-items:center;background:#080808;overflow:hidden}.slide.active{opacity:1;transform:scale(1);pointer-events:auto;z-index:2}.zoom-canvas{position:absolute;left:50%;top:50%;display:block;transform:translate3d(-50%,-50%,0) scale(1);transform-origin:center center;will-change:transform}.zoom-canvas img{display:block;width:100%;height:100%;object-fit:fill;background:#050505}.presentation-shell.is-zoomed .zoom-canvas{transition:none}.presentation-shell.is-zoomed .nav-arrow,.presentation-shell.is-zoomed .slide-counter,.presentation-shell.is-zoomed .gesture-hint{opacity:0;pointer-events:none}
    .slide-counter{position:absolute;top:16px;right:18px;z-index:10;padding:8px 12px;border:1px solid rgba(212,175,55,.32);border-radius:999px;color:#fff;background:rgba(0,0,0,.58);backdrop-filter:blur(10px);font-size:.76rem;letter-spacing:.08em}.slide-counter strong{color:var(--gold2)}
    .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:12;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:white;background:rgba(0,0,0,.55);border:1px solid rgba(212,175,55,.30);backdrop-filter:blur(10px);transition:.22s ease}.nav-arrow:hover{color:var(--gold2);border-color:rgba(212,175,55,.72);background:rgba(0,0,0,.78)}.nav-arrow.prev{left:16px}.nav-arrow.next{right:16px}.nav-arrow svg{width:23px;height:23px}
    .gesture-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:11;padding:8px 12px;border-radius:999px;font-size:.72rem;color:#ddd;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);opacity:0;animation:hint 4.8s ease 1.2s 1;pointer-events:none;white-space:nowrap}@keyframes hint{0%,100%{opacity:0;transform:translate(-50%,8px)}20%,75%{opacity:1;transform:translate(-50%,0)}}
    .progress{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:20;background:rgba(255,255,255,.07)}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 12px rgba(212,175,55,.55);transition:width .35s ease}
    .footer{z-index:28;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 18px;background:linear-gradient(180deg,rgba(5,5,5,.90),rgba(5,5,5,.98));border-top:1px solid var(--line);backdrop-filter:blur(14px)}.dots{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.dot{width:9px;height:9px;padding:0;border-radius:50%;cursor:pointer;background:rgba(255,255,255,.22);transition:.25s ease}.dot:hover{background:rgba(212,175,55,.55)}.dot.active{width:28px;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 16px rgba(212,175,55,.35)}
    .thumb-panel{position:fixed;inset:var(--header) 0 var(--footer);z-index:40;background:rgba(2,2,2,.90);backdrop-filter:blur(18px);padding:clamp(18px,3vw,44px);opacity:0;visibility:hidden;transition:.25s ease;overflow:auto}.thumb-panel.open{opacity:1;visibility:visible}.thumb-grid{width:min(1200px,100%);margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:#0b0b0c;cursor:pointer;transition:.22s ease}.thumb:hover,.thumb.active{transform:translateY(-3px);border-color:rgba(212,175,55,.68);box-shadow:0 18px 45px rgba(0,0,0,.42)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;right:9px;bottom:9px;background:rgba(0,0,0,.74);border:1px solid rgba(212,175,55,.30);color:#fff;padding:5px 8px;border-radius:999px;font-size:.7rem}
    .loading{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#050505;transition:opacity .5s ease,visibility .5s ease}.loading.hidden{opacity:0;visibility:hidden}.loader-card{text-align:center}.loader-logo{width:78px;height:78px;margin:auto;border:1px solid rgba(212,175,55,.7);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-weight:800;font-size:1.45rem;letter-spacing:-4px;box-shadow:0 0 40px rgba(212,175,55,.14);animation:pulse 1.7s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.035);box-shadow:0 0 60px rgba(212,175,55,.24)}}.loader-title{margin-top:18px;font-weight:700}.loader-title span{color:var(--gold)}.loader-sub{margin-top:7px;color:var(--muted);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media(max-width:760px){:root{--header:68px;--footer:58px}.brand-subtitle{display:none}.brand-mark{width:38px;height:38px}.topbar{padding:0 12px}.actions{gap:6px}.icon-btn{width:38px;height:38px}.stage{padding:8px}.presentation-shell{width:100%;height:auto;max-height:calc(100vh - var(--header) - var(--footer) - 16px);border-radius:14px}.nav-arrow{width:42px;height:42px}.nav-arrow.prev{left:8px}.nav-arrow.next{right:8px}.slide-counter{top:9px;right:9px;font-size:.66rem}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="loading" id="loading" aria-live="polite"><div class="loader-card"><div class="loader-logo">UW</div><div class="loader-title">URBAN<span>WATCH</span>.app</div><div class="loader-sub">Carregando Executive Briefing</div></div></div>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">UW</div><div class="brand-copy"><div class="brand-title">Urban<span>Watch</span>.app × Ademicon</div><div class="brand-subtitle">Inteligência Operacional para Expansão Territorial</div></div></div>
      <div class="actions">
        <button class="icon-btn" id="thumbBtn" title="Visão geral" aria-label="Abrir visão geral dos slides"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
        <button class="icon-btn" id="autoBtn" title="Apresentação automática" aria-label="Ativar apresentação automática"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="icon-btn" id="shareBtn" title="Compartilhar" aria-label="Compartilhar apresentação"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.7 6.8-4.1M8.6 13.3l6.8 4.1"/></svg></button>
        <button class="icon-btn" id="fullscreenBtn" title="Tela cheia" aria-label="Abrir em tela cheia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
      </div>
    </header>
    <section class="stage" aria-label="Apresentação digital"><div class="ambient"></div><div class="presentation-shell" id="presentation" tabindex="0"><div class="slide-counter"><strong id="currentNumber">01</strong> / <span id="totalNumber">10</span></div><button class="nav-arrow prev" id="prevBtn" aria-label="Slide anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><button class="nav-arrow next" id="nextBtn" aria-label="Próximo slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button><div id="slides"></div><div class="gesture-hint">Deslize ou use as setas para navegar</div><div class="progress"><div class="progress-bar" id="progressBar"></div></div></div></section>
    <footer class="footer"><div class="dots" id="dots" aria-label="Navegação entre slides"></div></footer>
  </main>
  <aside class="thumb-panel" id="thumbPanel" aria-hidden="true"><div class="thumb-grid" id="thumbGrid"></div></aside><div class="sr-only" id="liveRegion" aria-live="polite"></div>
  <script>
    const presentationFiles=[
      {src:"capa00.png",alt:"Capa UrbanWatch.app — Inteligência Operacional para Expansão Territorial"},
      {src:"capa01.png",alt:"Executive Briefing UrbanWatch.app"},
      {src:"slide01.png",alt:"Slide 01 — Objetivo"},
      {src:"slide02.png",alt:"Slide 02 — Critérios considerados"},
      {src:"slide03.png",alt:"Slide 03 — Análise da região"},
      {src:"slide04.png",alt:"Slide 04 — Opções prioritárias"},
      {src:"slide05.png",alt:"Slide 05 — Observação importante"},
      {src:"slide06.png",alt:"Slide 06 — Nossa percepção"},
      {src:"slide07.png",alt:"Slide 07 — Considerações finais"},
      {src:"slide08.png",alt:"Slide 08 — Encerramento e agradecimento"}
    ];
    const slidesContainer=document.getElementById("slides"),dotsContainer=document.getElementById("dots"),thumbGrid=document.getElementById("thumbGrid"),thumbPanel=document.getElementById("thumbPanel"),currentNumber=document.getElementById("currentNumber"),totalNumber=document.getElementById("totalNumber"),progressBar=document.getElementById("progressBar"),loading=document.getElementById("loading"),liveRegion=document.getElementById("liveRegion"),presentation=document.getElementById("presentation"),autoBtn=document.getElementById("autoBtn");
    let current=0,autoplay=null,touchStartX=0,touchEndX=0,loadedCount=0;
    let scale=1,translateX=0,translateY=0,startScale=1,startTranslateX=0,startTranslateY=0,pinchStartDistance=0,pinchStartMid={x:0,y:0},panStart={x:0,y:0},isPinching=false,isPanning=false,swipeCandidate=false,lastTap=0;totalNumber.textContent=String(presentationFiles.length).padStart(2,"0");
    presentationFiles.forEach((item,index)=>{const slide=document.createElement("figure");slide.className="slide"+(index===0?" active":"");slide.setAttribute("aria-hidden",index===0?"false":"true");const img=document.createElement("img");img.src=item.src;img.alt=item.alt;img.decoding="async";img.loading=index<2?"eager":"lazy";img.addEventListener("load",handleAssetReady);img.addEventListener("error",()=>{handleAssetReady();console.warn("Imagem não encontrada:",item.src)});const canvas=document.createElement("div");canvas.className="zoom-canvas";canvas.appendChild(img);slide.appendChild(canvas);slidesContainer.appendChild(slide);const dot=document.createElement("button");dot.className="dot"+(index===0?" active":"");dot.type="button";dot.setAttribute("aria-label",`Ir para o slide ${index+1}`);dot.addEventListener("click",()=>goTo(index));dotsContainer.appendChild(dot);const thumb=document.createElement("button");thumb.className="thumb"+(index===0?" active":"");thumb.type="button";thumb.innerHTML=`<img src="${item.src}" alt=""><span>${String(index+1).padStart(2,"0")}</span>`;thumb.addEventListener("click",()=>{goTo(index);toggleThumbs(false)});thumbGrid.appendChild(thumb)});
    setTimeout(()=>loading.classList.add("hidden"),2800);function handleAssetReady(){loadedCount++;if(this.closest?.(".slide.active")){sizeActiveCanvas();applyTransform()}if(loadedCount>=Math.min(2,presentationFiles.length))loading.classList.add("hidden")}
    function goTo(index){resetZoom(false);const slides=[...document.querySelectorAll(".slide")],dots=[...document.querySelectorAll(".dot")],thumbs=[...document.querySelectorAll(".thumb")];current=(index+presentationFiles.length)%presentationFiles.length;slides.forEach((slide,i)=>{const active=i===current;slide.classList.toggle("active",active);slide.setAttribute("aria-hidden",active?"false":"true")});dots.forEach((dot,i)=>dot.classList.toggle("active",i===current));thumbs.forEach((thumb,i)=>thumb.classList.toggle("active",i===current));currentNumber.textContent=String(current+1).padStart(2,"0");progressBar.style.width=`${((current+1)/presentationFiles.length)*100}%`;liveRegion.textContent=presentationFiles[current].alt;const url=new URL(window.location.href);url.hash=`slide-${current+1}`;history.replaceState(null,"",url)}
    const next=()=>goTo(current+1),prev=()=>goTo(current-1);document.getElementById("nextBtn").addEventListener("click",next);document.getElementById("prevBtn").addEventListener("click",prev);
    document.addEventListener("keydown",event=>{if(thumbPanel.classList.contains("open")&&event.key==="Escape"){toggleThumbs(false);return}if(["ArrowRight","PageDown"," "].includes(event.key)){event.preventDefault();next()}if(["ArrowLeft","PageUp"].includes(event.key)){event.preventDefault();prev()}if(event.key==="Home")goTo(0);if(event.key==="End")goTo(presentationFiles.length-1);if(event.key.toLowerCase()==="f")toggleFullscreen();if(event.key.toLowerCase()==="p")toggleAutoplay()});
    function activeCanvas(){return document.querySelector(".slide.active .zoom-canvas")}
    function activeImage(){return document.querySelector(".slide.active img")}
    function distance(a,b){return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)}
    function midpoint(a,b){const r=presentation.getBoundingClientRect();return{x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top}}
    function sizeActiveCanvas(){
      const canvas=activeCanvas(),img=activeImage();
      if(!canvas||!img)return {width:presentation.clientWidth,height:presentation.clientHeight};
      const vw=presentation.clientWidth,vh=presentation.clientHeight;
      const naturalW=img.naturalWidth||16,naturalH=img.naturalHeight||9;
      const ratio=Math.min(vw/naturalW,vh/naturalH);
      const width=Math.max(1,naturalW*ratio),height=Math.max(1,naturalH*ratio);
      canvas.style.width=`${width}px`;canvas.style.height=`${height}px`;
      return {width,height};
    }
    function panLimits(){
      const base=sizeActiveCanvas();
      return {
        maxX:Math.max(0,(base.width*scale-presentation.clientWidth)/2),
        maxY:Math.max(0,(base.height*scale-presentation.clientHeight)/2)
      };
    }
    function clampPan(){const {maxX,maxY}=panLimits();translateX=Math.min(maxX,Math.max(-maxX,translateX));translateY=Math.min(maxY,Math.max(-maxY,translateY))}
    function applyTransform(){const canvas=activeCanvas();if(!canvas)return;clampPan();canvas.style.transform=`translate3d(calc(-50% + ${translateX}px),calc(-50% + ${translateY}px),0) scale(${scale})`;presentation.classList.toggle("is-zoomed",scale>1.01)}
    function resetZoom(animate=true){const canvas=activeCanvas();scale=1;translateX=0;translateY=0;isPinching=false;isPanning=false;swipeCandidate=false;presentation.classList.remove("is-zoomed");if(canvas){canvas.style.transition=animate?"transform .25s ease":"none";sizeActiveCanvas();canvas.style.transform="translate3d(-50%,-50%,0) scale(1)";if(!animate)requestAnimationFrame(()=>canvas.style.transition="")}}
    function zoomAt(targetScale,focusX=presentation.clientWidth/2,focusY=presentation.clientHeight/2){
      const oldScale=scale;scale=Math.min(4,Math.max(1,targetScale));
      const ratio=scale/oldScale;
      translateX=(translateX-(focusX-presentation.clientWidth/2))*ratio+(focusX-presentation.clientWidth/2);
      translateY=(translateY-(focusY-presentation.clientHeight/2))*ratio+(focusY-presentation.clientHeight/2);
      applyTransform();
    }

    presentation.addEventListener("touchstart",e=>{
      if(e.touches.length===2){
        e.preventDefault();isPinching=true;isPanning=false;swipeCandidate=false;pinchStartDistance=distance(e.touches[0],e.touches[1]);pinchStartMid=midpoint(e.touches[0],e.touches[1]);startScale=scale;startTranslateX=translateX;startTranslateY=translateY;
      }else if(e.touches.length===1){
        const t=e.touches[0];touchStartX=t.screenX;touchEndX=t.screenX;panStart={x:t.clientX,y:t.clientY};startTranslateX=translateX;startTranslateY=translateY;isPanning=scale>1.01;swipeCandidate=scale<=1.01;
      }
    },{passive:false});

    presentation.addEventListener("touchmove",e=>{
      if(e.touches.length===2&&isPinching){
        e.preventDefault();const d=distance(e.touches[0],e.touches[1]);const mid=midpoint(e.touches[0],e.touches[1]);const nextScale=Math.min(4,Math.max(1,startScale*(d/pinchStartDistance)));const ratio=nextScale/startScale;translateX=(startTranslateX-(pinchStartMid.x-presentation.clientWidth/2))*ratio+(mid.x-presentation.clientWidth/2);translateY=(startTranslateY-(pinchStartMid.y-presentation.clientHeight/2))*ratio+(mid.y-presentation.clientHeight/2);scale=nextScale;applyTransform();
      }else if(e.touches.length===1&&scale>1.01){
        e.preventDefault();const t=e.touches[0];translateX=startTranslateX+(t.clientX-panStart.x);translateY=startTranslateY+(t.clientY-panStart.y);isPanning=true;swipeCandidate=false;applyTransform();
      }else if(e.touches.length===1&&swipeCandidate){touchEndX=e.touches[0].screenX}
    },{passive:false});

    presentation.addEventListener("touchend",e=>{
      if(isPinching&&e.touches.length<2){isPinching=false;if(scale<1.08)resetZoom();return}
      if(isPanning){isPanning=false;applyTransform();return}
      if(swipeCandidate&&scale<=1.01){const delta=touchEndX-touchStartX;if(Math.abs(delta)>50)delta<0?next():prev()}
      swipeCandidate=false;
      if(e.changedTouches.length===1){const now=Date.now();const t=e.changedTouches[0],r=presentation.getBoundingClientRect();if(now-lastTap<300){scale>1.01?resetZoom():zoomAt(2,t.clientX-r.left,t.clientY-r.top);lastTap=0}else lastTap=now}
    },{passive:false});

    presentation.addEventListener("touchcancel",()=>{isPinching=false;isPanning=false;swipeCandidate=false},{passive:true});
    document.getElementById("thumbBtn").addEventListener("click",()=>toggleThumbs(!thumbPanel.classList.contains("open")));thumbPanel.addEventListener("click",e=>{if(e.target===thumbPanel)toggleThumbs(false)});function toggleThumbs(open){thumbPanel.classList.toggle("open",open);thumbPanel.setAttribute("aria-hidden",open?"false":"true")}
    function toggleAutoplay(){if(autoplay){clearInterval(autoplay);autoplay=null;autoBtn.setAttribute("aria-label","Ativar apresentação automática");autoBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'}else{autoplay=setInterval(next,7000);autoBtn.setAttribute("aria-label","Pausar apresentação automática");autoBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'}}autoBtn.addEventListener("click",toggleAutoplay);
    function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}document.getElementById("fullscreenBtn").addEventListener("click",toggleFullscreen);
    document.getElementById("shareBtn").addEventListener("click",async()=>{const shareData={title:"UrbanWatch.app × Ademicon",text:"Executive Briefing — Inteligência Operacional para Expansão Territorial.",url:window.location.href};try{if(navigator.share)await navigator.share(shareData);else{await navigator.clipboard.writeText(window.location.href);alert("Link copiado para a área de transferência.")}}catch(error){if(error.name!=="AbortError")console.error(error)}});
    window.addEventListener("resize",()=>{sizeActiveCanvas();applyTransform()});
    const hashMatch=window.location.hash.match(/slide-(\d+)/i);if(hashMatch){const requested=Number(hashMatch[1])-1;if(requested>=0&&requested<presentationFiles.length)current=requested}goTo(current);
  </script>
</body>
