<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elias Silva | Portal Premium | UrbanWatch</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#020B12;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* ---------- LOGIN ---------- */

#login{
    width:100%;
    max-width:420px;
    padding:35px;
    text-align:center;
    color:#FFF;
}

.logo{
    width:120px;
    margin-bottom:25px;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

h2{
    font-size:18px;
    color:#D4AF37;
    margin-bottom:30px;
    font-weight:normal;
}

input{

    width:100%;
    padding:18px;

    border:none;
    outline:none;

    border-radius:12px;

    background:#13232E;
    color:#FFF;

    font-size:18px;
    text-align:center;

}

button{

    width:100%;
    margin-top:18px;

    padding:18px;

    border:none;
    border-radius:12px;

    background:#D4AF37;
    color:#000;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

}

button:hover{
    background:#E6C86A;
}

#erro{

    display:none;

    color:#FF6464;

    margin-top:20px;

}

/* ---------- PORTAL ---------- */

#portal{

    display:none;

    width:100%;
    max-width:768px;
    margin:auto;
    position:relative;

}

#portal img{

    width:100%;
    display:block;

}

.botao{

    position:absolute;

    left:6%;
    width:88%;
    height:5.9%;

    border-radius:20px;

    z-index:100;

}

/* posições */

.whatsapp{
    top:55.7%;
}

.sobre{
    top:62.7%;
}

.email{
    top:69.7%;
}

.linkedin{
    top:76.7%;
}

.urbanwatch{
    top:83.7%;
}

.galeria{
    top:90.7%;
}

.botao:hover{

    background:rgba(212,175,55,.08);

}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="login">

<img src="https://urbanwatch.app/assets/logo/logo.png" class="logo">

<h1>Elias Silva</h1>

<h2>Portal Premium UrbanWatch</h2>

<input
type="password"
id="senha"
placeholder="Senha de acesso">

<button onclick="entrar()">

Entrar

</button>

<div id="erro">

Senha incorreta.

</div>

</div>

<!-- PORTAL -->

<div id="portal">

<img
src="home_es.png"
alt="Portal Elias Silva">

<a
class="botao whatsapp"
href="https://wa.me/55859920089357"
target="_blank"></a>

<a
class="botao sobre"
href="#"></a>

<a
class="botao email"
href="mailto:urbanwatch.app@gmail.com"></a>

<a
class="botao linkedin"
href="./LinkedIn/"></a>

<a
class="botao urbanwatch"
href="https://urbanwatch.app"
target="_blank"></a>

<a
class="botao galeria"
href="./galeria/"></a>

</div>

<script>

function entrar(){

let senha=document.getElementById("senha").value;

if(senha==="2026"){

document.getElementById("login").style.display="none";

document.getElementById("portal").style.display="block";

window.scrollTo(0,0);

}else{

document.getElementById("erro").style.display="block";

}

}

document.getElementById("senha").addEventListener("keypress",function(e){

if(e.key==="Enter"){

entrar();

}

});

</script>

</body>

</html>
