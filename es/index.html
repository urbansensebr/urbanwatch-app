<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elias Silva | Portal Premium | UrbanWatch</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020B12;
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
}

/* LOGIN */

#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  background:linear-gradient(180deg,#03131d,#020B12);
}

.login-box{
  width:100%;
  max-width:420px;
  text-align:center;
  color:#fff;
}

.logo-login{
  width:150px;
  max-width:65%;
  margin:0 auto 26px;
  display:block;
  border-radius:50%;
}

.login-box h1{
  font-size:30px;
  letter-spacing:3px;
  margin-bottom:8px;
}

.login-box h2{
  font-size:16px;
  letter-spacing:2px;
  color:#D4AF37;
  font-weight:400;
  margin-bottom:28px;
}

.login-box input{
  width:100%;
  padding:17px;
  border:1px solid rgba(212,175,55,.35);
  border-radius:14px;
  background:#071A26;
  color:#fff;
  font-size:18px;
  text-align:center;
  outline:none;
}

.login-box button{
  width:100%;
  margin-top:16px;
  padding:17px;
  border:none;
  border-radius:14px;
  background:#D4AF37;
  color:#020B12;
  font-size:17px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
}

#erro{
  display:none;
  margin-top:16px;
  color:#ff6b6b;
  font-size:15px;
}

/* PORTAL */

#portal{
  display:none;
  width:100%;
  max-width:768px;
  margin:0 auto;
  position:relative;
}

#portal img{
  width:100%;
  display:block;
}

.botao{
  position:absolute;
  left:6%;
  width:88%;
  height:5.7%;
  border-radius:18px;
  z-index:10;
}

.whatsapp{ top:55.9%; }
.sobre{ top:62.9%; }
.email{ top:69.9%; }
.linkedin{ top:76.9%; }
.urbanwatch{ top:83.9%; }
.galeria{ top:90.8%; }

.botao:active{
  background:rgba(212,175,55,.12);
}
</style>
</head>

<body>

<section id="login">
  <div class="login-box">

    <img
      src="/assets/logo.png"
      alt="UrbanWatch"
      class="logo-login">

    <h1>ELIAS SILVA</h1>
    <h2>PORTAL PREMIUM URBANWATCH</h2>

    <input
      type="password"
      id="senha"
      placeholder="Senha de acesso"
      autocomplete="off">

    <button onclick="entrar()">ENTRAR</button>

    <div id="erro">Senha incorreta.</div>

  </div>
</section>

<main id="portal">

  <img src="home_es.png" alt="Portal Premium UrbanWatch - Elias Silva">

  <a class="botao whatsapp"
     href="https://wa.me/5585920089357"
     target="_blank"
     aria-label="Falar no WhatsApp"></a>

  <a class="botao sobre"
     href="#"
     aria-label="Sobre mim"></a>

  <a class="botao email"
     href="mailto:urbanwatch.app@gmail.com"
     aria-label="Enviar e-mail"></a>

  <a class="botao linkedin"
     href="./LinkedIn/index.html"
     aria-label="Manifesto Elias Silva"></a>

  <a class="botao urbanwatch"
     href="https://urbanwatch.app"
     target="_blank"
     aria-label="UrbanWatch.app"></a>

  <a class="botao galeria"
     href="./galeria/"
     aria-label="Galeria de Conexões Genuínas"></a>

</main>

<script>
function entrar(){
  const senha = document.getElementById("senha").value;

  if(senha === "2026"){
    document.getElementById("login").style.display = "none";
    document.getElementById("portal").style.display = "block";
    window.scrollTo(0,0);
  }else{
    document.getElementById("erro").style.display = "block";
  }
}

document.getElementById("senha").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    entrar();
  }
});
</script>

</body>
</html>
