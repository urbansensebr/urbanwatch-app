<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio UrbanWatch 9A</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
  background:url("fundo-urbanwatch.jpg") center/cover no-repeat;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
}

.container{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.brand{
  color:#D4AF37;
  font-size:clamp(30px,6vw,48px);
  letter-spacing:10px;
  margin-bottom:12px;
  text-shadow:0 0 18px #000;
}

.subtitle{
  color:#F1E5AC;
  font-size:clamp(13px,2.5vw,18px);
  letter-spacing:3px;
  margin-bottom:30px;
  text-shadow:0 0 14px #000;
}

.clock{
  width:min(78vw,430px);
  height:min(78vw,430px);
  background:rgba(10,10,10,.32);
  border-radius:50%;
  backdrop-filter:blur(6px);
  box-shadow:0 0 45px rgba(0,0,0,.65);
}

.phrase{
  margin-top:32px;
  color:white;
  font-size:clamp(17px,3.4vw,26px);
  letter-spacing:3px;
  text-shadow:0 0 18px #000;
}

.small{
  margin-top:12px;
  color:#D4AF37;
  font-size:clamp(14px,2.8vw,19px);
  text-shadow:0 0 12px #000;
}
</style>
</head>

<body>
<div class="overlay"></div>

<div class="container">
  <div class="brand">URBANWATCH</div>
  <div class="subtitle">O TEMPO SEM PRESSA. A TRAVESSIA SEM IMPROVISO.</div>

  <svg class="clock" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="49" fill="none" stroke="#D4AF37" stroke-width="0.35"/>

    <g id="marks"></g>

    <line id="hand" x1="50" y1="50" x2="50" y2="17"
      stroke="#F1E5AC" stroke-width="1.8" stroke-linecap="round"/>

    <circle cx="50" cy="50" r="4.2" fill="#D4AF37"/>

    <text x="50" y="66" text-anchor="middle"
      fill="#D4AF37" font-size="3.2" letter-spacing="1.2">
      URBANWATCH
    </text>

    <text x="50" y="72" text-anchor="middle"
      fill="#D4AF37" font-size="3.2">
      9A
    </text>
  </svg>

  <div class="phrase">INTELIGÊNCIA PARA QUEM NÃO IMPROVISA.</div>
  <div class="small">Desacelere. A travessia começou.</div>
</div>

<script>
const marks = document.getElementById("marks");
const hand = document.getElementById("hand");

for(let i=0;i<72;i++){
  const angle = i * 5;
  const isBig = i % 6 === 0;

  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1","50");
  line.setAttribute("y1", isBig ? "6" : "8");
  line.setAttribute("x2","50");
  line.setAttribute("y2","12");
  line.setAttribute("stroke", isBig ? "#D4AF37" : "#F1E5AC");
  line.setAttribute("stroke-width", isBig ? "0.9" : "0.45");
  line.setAttribute("stroke-linecap","round");
  line.setAttribute("transform", `rotate(${angle} 50 50)`);

  marks.appendChild(line);
}

function updateClock(){
  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();
  const s = now.getSeconds();

  const totalMinutes = h * 60 + m + s / 60;
  const angle = totalMinutes * 0.5;

  hand.setAttribute("transform", `rotate(${angle} 50 50)`);
}

updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
